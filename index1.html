<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Password Strength Analyzer
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:
linear-gradient(
135deg,
#071221,
#0a1931,
#102542
);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

color:white;

}

.dashboard{

width:900px;

background:
rgba(
255,
255,
255,
0.05
);

backdrop-filter:
blur(20px);

border-radius:25px;

padding:40px;

box-shadow:
0 0 50px
rgba(
0,
255,
255,
0.2
);

}

.title{

text-align:center;

margin-bottom:30px;

}

.title h1{

color:#00d5ff;

font-size:42px;

}

.title p{

color:#cbd5e1;

margin-top:10px;

}

.grid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:25px;

}

.card{

background:
rgba(
255,
255,
255,
0.06
);

padding:25px;

border-radius:18px;

}

input{

width:100%;

padding:16px;

border:none;

outline:none;

border-radius:10px;

font-size:16px;

margin-top:15px;

}

.actions{

display:flex;

gap:10px;

margin-top:15px;

}

button{

padding:14px;

flex:1;

border:none;

border-radius:10px;

cursor:pointer;

background:#00b7ff;

color:white;

font-size:15px;

}

button:hover{

transform:scale(1.03);

}

.progress{

height:16px;

background:#222;

border-radius:20px;

margin-top:20px;

overflow:hidden;

}

.bar{

height:100%;

width:0;

transition:.5s;

}

.status{

margin-top:15px;

font-size:30px;

font-weight:bold;

}

.entropy{

margin-top:15px;

font-size:18px;

color:#00d5ff;

}

.rules{

line-height:34px;

margin-top:20px;

}

.generated{

margin-top:20px;

padding:20px;

background:black;

border-radius:10px;

word-break:break-word;

color:#00ff88;

}

.footer{

margin-top:30px;

text-align:center;

color:#9ca3af;

}

.warning{

margin-top:15px;

color:#ff8080;

}

</style>

</head>

<body>

<div class="dashboard">

<div class="title">

<h1>
🔐 Password Strength Analyzer
</h1>

<p>
Cyber Security Internship Dashboard
</p>

</div>

<div class="grid">

<div class="card">

<h2>
Enter Password
</h2>

<input
id="password"
type="password"
placeholder="Type Password"
oninput="analyze()">

<div class="actions">

<button onclick="toggle()">
Show / Hide
</button>

<button onclick="generatePassword()">
Generate
</button>

</div>

<div class="progress">

<div
class="bar"
id="bar">
</div>

</div>

<div
class="status"
id="status">

Waiting...

</div>

<div
class="entropy"
id="entropy">

Entropy Score:
0 / 100

</div>

<div
class="warning"
id="reuse">

</div>

</div>

<div class="card">

<h2>
Security Checklist
</h2>

<div
class="rules"
id="rules">

❌ Minimum 8 Characters

</div>

<h2
style="margin-top:30px">

Suggested Password

</h2>

<div
class="generated"
id="suggested">

Click Generate

</div>

</div>

</div>

<div class="footer">

✔ Length Check  
✔ Complexity Check  
✔ Entropy Score  
✔ Password Suggestions  
✔ Password Reuse Detection  

</div>

</div>

<script>

let oldPasswords=
JSON.parse(
localStorage.getItem(
"history"
)
)
||[];

function analyze(){

let pwd=
document
.getElementById(
"password"
)
.value;

let score=0;

let output=[];

if(
pwd.length>=8
){
score++;
output.push(
"✅ Good Length"
);
}
else{
output.push(
"❌ Minimum 8 Characters"
);
}

if(
/[A-Z]/.test(
pwd
)
){
score++;
output.push(
"✅ Uppercase"
);
}
else{
output.push(
"❌ Add Uppercase"
);
}

if(
/[a-z]/.test(
pwd
)
){
score++;
output.push(
"✅ Lowercase"
);
}

if(
/[0-9]/.test(
pwd
)
){
score++;
output.push(
"✅ Number"
);
}
else{
output.push(
"❌ Add Number"
);
}

if(
/[^A-Za-z0-9]/.test(
pwd
)
){
score++;
output.push(
"✅ Special Character"
);
}
else{
output.push(
"❌ Add Special Character"
);
}

let text="Weak";
let color="#ff3b30";
let width="25%";

if(score>=3){

text="Medium";

color="#ff9500";

width="65%";

}

if(score>=5){

text="Strong";

color="#00ff88";

width="100%";

}

document
.getElementById(
"status"
)
.innerHTML=
text;

document
.getElementById(
"status"
)
.style.color=
color;

document
.getElementById(
"bar"
)
.style.width=
width;

document
.getElementById(
"bar"
)
.style.background=
color;

document
.getElementById(
"rules"
)
.innerHTML=
output.join(
"<br>"
);

/* ENTROPY */

let charset=0;

if(/[a-z]/.test(pwd))
charset+=26;

if(/[A-Z]/.test(pwd))
charset+=26;

if(/[0-9]/.test(pwd))
charset+=10;

if(/[^A-Za-z0-9]/.test(pwd))
charset+=32;

let entropy=0;

if(
pwd.length>0
){

entropy=
Math.round(
pwd.length
*
Math.log2(
charset
)
);

}

entropy=
Math.min(
entropy,
100
);

document
.getElementById(
"entropy"
)
.innerHTML=

"Entropy Score: "

+

entropy

+

" / 100";

if(
oldPasswords.includes(
pwd
)
){

document
.getElementById(
"reuse"
)
.innerHTML=
"⚠ Password already used";

}
else{

document
.getElementById(
"reuse"
)
.innerHTML=
"";

}

}

function generatePassword(){

let chars=

"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz123456789@#$%&";

let pwd="";

for(
let i=0;
i<16;
i++
){

pwd+=
chars[
Math.floor(
Math.random()
*
chars.length
)
];

}

document
.getElementById(
"suggested"
)
.innerHTML=
pwd;

oldPasswords.push(
pwd
);

localStorage.setItem(

"history",

JSON.stringify(
oldPasswords
)

);

}

function toggle(){

let input=

document
.getElementById(
"password"
);

input.type=

input.type===

"password"

?

"text"

:

"password";

}

</script>

</body>
</html>
